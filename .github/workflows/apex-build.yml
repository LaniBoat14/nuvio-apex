name: Apex build
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "compile = purity + Kotlin compile gate; release = also tests, signed APK, test pre-release"
        type: choice
        options: [compile, release]
        default: compile
      tag:
        description: "Pre-release tag for stage=release (must not look like a version)"
        default: test-apex
      release_version:
        description: "stage=release only: leave empty for a test pre-release; set to a version such as 0.1.0 to publish it as the real release the in-app updater offers"
        default: ""
permissions:
  contents: write
concurrency:
  group: apex-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI_USE_DEBUG_SIGNING: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stock purity
        run: python3 apex/apex_purity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: apex-gradle-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: apex-gradle-
      - name: Generate localhost TLS test fixture
        run: |
          mkdir -p app/src/test/resources
          [ -f app/src/test/resources/subtitle-redirect-test.p12 ] || keytool -genkeypair -alias subtitle-test -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 -keystore app/src/test/resources/subtitle-redirect-test.p12 -storepass changeit -keypass changeit -dname "CN=127.0.0.1" -ext "SAN=ip:127.0.0.1"
      - name: Restore private build configuration
        env:
          FLOW_KEYSTORE_BASE64: ${{ secrets.FLOW_KEYSTORE_BASE64 }}
          FLOW_LOCAL_PROPERTIES_BASE64: ${{ secrets.FLOW_LOCAL_PROPERTIES_BASE64 }}
          FLOW_DEV_PROPERTIES_BASE64: ${{ secrets.FLOW_DEV_PROPERTIES_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib, re
          root = pathlib.Path.cwd()
          for secret, filename in [("FLOW_KEYSTORE_BASE64", "apex-signing.keystore"), ("FLOW_LOCAL_PROPERTIES_BASE64", "local.properties")]:
              value = os.environ.get(secret, "")
              if not value: raise SystemExit("Missing repository secret: " + secret)
              path = root / filename
              path.write_bytes(base64.b64decode(value, validate=False))
              path.chmod(0o600)
          dev = os.environ.get("FLOW_DEV_PROPERTIES_BASE64", "")
          if dev:
              path = root / "local.dev.properties"
              path.write_bytes(base64.b64decode(dev, validate=False))
              path.chmod(0o600)
          for filename in ["local.properties", "local.dev.properties"]:
              path = root / filename
              if not path.exists(): continue
              text = path.read_text()
              values = {"sdk.dir": os.environ["ANDROID_HOME"], "NUVIO_RELEASE_STORE_FILE": str(root / "apex-signing.keystore"), "DOVI_LIBDOVI_PREBUILT_ROOT": str(root / "DV7/libdovi")}
              for key, value in values.items():
                  pattern = r"(?m)^[ \t]*" + re.escape(key) + r"[ \t]*=.*$"
                  line = key + "=" + value
                  text = re.sub(pattern, lambda _: line, text) if re.search(pattern, text) else text + "\n" + line + "\n"
              path.write_text(text)
          PY
      - name: Compile gate (main and unit-test Kotlin)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileFullReleaseKotlin :app:compileFullReleaseUnitTestKotlin --max-workers=2 --no-daemon --console=plain --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process -PapexArm32Only=true
      - name: Unit tests
        if: inputs.stage == 'release'
        run: ./gradlew :app:testFullReleaseUnitTest --max-workers=2 --no-daemon --console=plain --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process -PapexArm32Only=true
      - name: Assemble signed release
        if: inputs.stage == 'release'
        run: ./gradlew :app:assembleFullRelease --max-workers=2 --no-daemon --console=plain --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process -PapexArm32Only=true
      - name: Collect failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for name in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              root = ET.parse(name).getroot()
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print(case.get('classname'), case.get('name'), failure.text or failure.get('message'))
          PY
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: ignore
      - name: Verify APK
        if: inputs.stage == 'release'
        run: |
          APK=app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.jeffrey.nuvioapex'"
          unzip -l "$APK" | grep -E "assets/dexopt/baseline.prof|assets/updater_dm/index.properties"
      - uses: actions/upload-artifact@v4
        if: inputs.stage == 'release'
        with:
          name: apex-signed-apk
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish test pre-release
        if: inputs.stage == 'release' && inputs.release_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in [0-9]*|v[0-9]*) echo "Tag must not look like a version"; exit 1;; esac
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Apex test $TAG" --notes "Test build, not an update. Nuvio Apex: stock beta.11 base with Arc network engine, glass analytics overlay, lossless audio and Dolby Vision." app/build/outputs/apk/full/release/*.apk
      - name: Publish release for the in-app updater
        if: inputs.stage == 'release' && inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.release_version }}
        run: |
          case "$VERSION" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "release_version must look like 0.1.0"; exit 1;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release $VERSION already exists; refusing to replace a published release."; exit 1; fi
          BASE=$(grep -o 'NUVIO_BASE", "\\"[^"\\]*' app/build.gradle.kts | sed 's/.*\\"//')
          gh release create "$VERSION" --target "$GITHUB_SHA" --latest --title "Nuvio Apex $VERSION" --notes "Nuvio Apex $VERSION, based on Nuvio $BASE. Install over your current Apex; settings are kept." app/build/outputs/apk/full/release/*.apk
      - name: Remove private inputs
        if: always()
        run: rm -f apex-signing.keystore local.properties local.dev.properties
